<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopora Wishlist</title>
  <meta name="description" content="Shopora wishlist page showing your saved favorites and quick add-to-cart actions." />
  <meta name="keywords" content="Shopora, wishlist, saved products, ecommerce" />
  <meta name="theme-color" content="#1f2a55" />
  <meta property="og:title" content="Shopora Wishlist" />
  <meta property="og:description" content="Manage your saved favorites on Shopora with a polished wishlist experience." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="announcement container">
      Free shipping on orders over $99 • Secure payments • 30-day premium returns.
    </div>
    <div class="header-top container">
      <a class="brand" href="index.html">
        <span class="brand-mark">S</span>
        <span class="brand-text">Shopora</span>
      </a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="index.html#products">Shop</a>
        <a href="about.html">About</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <div class="search-group">
          <label for="search-input" class="sr-only">Search products</label>
          <input id="search-input" type="search" placeholder="Search for headphones, jackets, cameras..." />
          <button id="search-button" type="button">Search</button>
        </div>
        <a href="wishlist.html" class="action-button">Wishlist <span class="badge" id="wishlist-count">0</span></a>
        <button type="button" id="cart-toggle" class="action-button">Cart <span class="badge" id="cart-count">0</span></button>
      </div>
    </div>
  </header>

  <main class="wishlist-page container">
    <div class="breadcrumb">
      <a href="index.html">Home</a> <span>/</span> <span>Wishlist</span>
    </div>
    <section class="wishlist-hero">
      <div>
        <div class="section-heading">
          <h2>Saved for later</h2>
          <p>Review your favorites and quickly move items into your cart.</p>
        </div>
      </div>
      <div>
        <a class="secondary-link" href="index.html">Continue shopping</a>
      </div>
    </section>

    <section id="wishlist-list" class="wishlist-grid"></section>
  </main>

  <aside class="cart-sidebar" id="cart-sidebar" aria-label="Shopping cart">
    <div class="cart-header">
      <h2>Shopping cart</h2>
      <button id="cart-close" aria-label="Close cart sidebar">×</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-totals">
        <span>Total</span>
        <strong id="cart-total">$0.00</strong>
      </div>
      <button class="primary-button full-width" type="button" id="checkout-button">Proceed to checkout</button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <script src="data.js"></script>
  <script src="wishlist.js"></script>
</body>
</html>
